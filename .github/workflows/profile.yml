name: Profile cards

# Membuat kartu profil (header, stats, streak, bahasa) + animasi pacman,
# lalu menerbitkannya ke branch `output` (dipakai oleh README.md).
on:
  schedule:
    - cron: "23 */12 * * *" # 2x sehari (menit ke-23, tiap 12 jam)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install opentype.js
        run: npm install --no-save opentype.js@1.3.4

      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Generate profile cards
        run: node scripts/build-cards.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
